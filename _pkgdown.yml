url: https://jessietrudeau.com/bribeR

template:
  bootstrap: 5
  light-switch: true

home:
  title: "bribeR: Download, Process, and Analyze Vladivideos Transcripts"
  description: >
    An R package for accessing and analyzing text transcript
    data from the *Vladivideos,* covert recordings documenting bribery and
    corruption during Alberto Fujimori’s presidency in Peru (1990-2000).

  sidebar:
    structure: [links, license, citation, authors, dev]


navbar:
  structure:
    left:  [home, reference, articles, news]
    right: [search, lightswitch, github]
  components:
    articles:
      text: Articles
      menu:
        - text: "bribeR Data Guide"
          href: articles/briber_data_guide.html
        - text: "Raw Data Guide"
          href: articles/raw_data_guide.html
        - text: "Using bribeR"
          href: articles/using_briber.html
        - text: "Transcript Network App"
          href: articles/transcript_network_app.html

reference:
  - title: "Read Transcripts"
    desc: "Load and filter the Vladivideos transcript corpus."
    contents:
      - read_transcripts
      - get_transcripts_raw

  - title: "Find Transcripts"
    desc: "Search the corpus by speaker or topic."
    contents:
      - get_transcript_id

  - title: "Integrate with Metadata"
    desc: "Transcript-level summary information."
    contents:
      - read_transcript_meta_data
      - get_transcript_speakers

  - title: "Datasets"
    desc: "Searchable datasets included in bribeR."
    contents:
      - compiled_transcripts
      - transcript_index
      - speakers_per_transcript
      - speakers

  - title: "Visualization"
    desc: "Functions and data files for Shiny network visualization."
    contents:
      - run_transcript_network_app
      - topic_descriptions


articles:
  - title: "Articles"
    navbar: ~
    contents:
      - briber_data_guide
      - raw_data_guide
      - using_briber
      - transcript_network_app
